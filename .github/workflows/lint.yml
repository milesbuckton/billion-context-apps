name: Lint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts with ShellCheck
        run: shellcheck *.sh scripts/*.sh

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pylint
        run: python -m pip install pylint==3.3.9
      - name: Lint Python scripts with Pylint
        run: pylint scripts/*.py
